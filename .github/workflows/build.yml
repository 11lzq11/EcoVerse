name: Build EcoVerse

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run analyzer
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
  build-windows:
    name: Build Windows EXE
    runs-on: windows-2019
    needs: analyze
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Get dependencies
      run: flutter pub get
      
    - name: Enable Windows desktop support
      run: flutter config --enable-windows-desktop
      
    - name: Build Windows release
      run: flutter build windows --release
      
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: ecoverse-windows
        path: build/windows/x64/runner/Release/
        
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: analyze
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Enable macOS desktop support
      run: flutter config --enable-macos-desktop
      
    - name: Add macOS platform
      run: flutter create . --platforms=macos
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build macOS release
      run: flutter build macos --release
      
    - name: Create DMG
      run: |
        cd build/macos/Build/Products/Release
        hdiutil create -volname EcoVerse -srcfolder EcoVerse.app -ov -format UDZO EcoVerse.dmg
        
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ecoverse-macos
        path: build/macos/Build/Products/Release/EcoVerse.dmg
        
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: analyze
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Enable iOS desktop support
      run: flutter config --enable-ios
      
    - name: Add iOS platform
      run: flutter create . --platforms=ios
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS release
      run: |
        flutter build ios --release --no-codesign
      
    - name: Archive IPA
      run: |
        cd build/ios/iphoneos
        mkdir -p Payload
        cp -r Runner.app Payload/
        zip -r ecoverse.ipa Payload
        
    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ecoverse-ios
        path: build/ios/iphoneos/ecoverse.ipa
        
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Android release
      run: flutter build apk --release
      
    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: ecoverse-android
        path: build/app/outputs/flutter-apk/app-release.apk
