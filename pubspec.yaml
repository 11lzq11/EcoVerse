name: ecoverse
description: 灵境 EcoVerse - 开放创造式沙盒游戏
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flame: ^1.15.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Assets are optional - create placeholder directories if needed
  # assets:
